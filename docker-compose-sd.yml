services:
  hi-sportdb-mongo:
    image: registry.diginfra.net/tsd/hi-sportdb-mongo:0.0.3
    volumes:
      - hi-sportdb-mongo-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' > /dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - hi-sportdb-net

  hi-sportdb-panoptes:
    image: registry.diginfra.net/tsd/panoptes-backend:hi-sportdb
    environment:
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - ES_SCHEME=${ES_SCHEME}
      - ES_USERNAME=${ES_USERNAME}
      - ES_PASSWORD=${ES_PASSWORD}
      - MONGO_CONNECTION=${MONGO}
    depends_on:
      hi-sportdb-mongo:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hi-sportdb-panoptes.entrypoints=http"
      - "traefik.http.routers.hi-sportdb-panoptes.rule=Host(`sport.sd.di.huc.knaw.nl`) && PathPrefix(`/api`)"
      - "traefik.http.services.hi-sportdb-panoptes.loadbalancer.server.port=8000"
    restart: unless-stopped
    networks:
      - hi-sportdb-net
      - traefik-public

  hi-sportdb-browser:
    image: registry.diginfra.net/tsd/hi-sportdb-browser:0.0.5
    environment:
      - VITE_PANOPTES_URL=https://sport.sd.di.huc.knaw.nl
      - VITE_PANOPTES_IS_EMBEDDED=false
      - VITE_PANOPTES_DATASET=sport
      - VITE_PANOPTES_SEARCH_PATH=/$$dataset/search
      - VITE_PANOPTES_DETAIL_PATH=/$$dataset/details/$$id
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hi-sportdb-browser.entrypoints=http"
      - "traefik.http.routers.hi-sportdb-browser.rule=Host(`sport.sd.di.huc.knaw.nl`)"
      - "traefik.http.services.hi-sportdb-browser.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - hi-sportdb-net
      - traefik-public

volumes:
  hi-sportdb-mongo-data:

networks:
  hi-sportdb-net:
    internal: true
  traefik-public:
    external: true
